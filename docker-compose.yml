services:
  minio:
    image: scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data

  dagster:
    build: .
    init: true
    depends_on:
      - minio
    ports:
      - "3001:3000"   # Dagster UI
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: datalake
      SOURCE_MODE: ${SOURCE_MODE:-soda}
      START_DATE: ${START_DATE:-2023-01-01}
      END_DATE: ${END_DATE:-2023-01-15}
      MAX_ROWS_PER_DAY: ${MAX_ROWS_PER_DAY:-0}
      SODA_APP_TOKEN: ${SODA_APP_TOKEN:-}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      REJECT_RATIO_THRESHOLD: ${REJECT_RATIO_THRESHOLD:-0.10}

    volumes:
      - dagster_home:/opt/dagster_home

volumes:
  minio_data:
  dagster_home: